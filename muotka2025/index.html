<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body.no-scroll {
        overflow: hidden;
        position: fixed;
        width: 100%;
    }
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 1rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .gallery img {
      width: 100%;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .modal img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid white;
      border-radius: 8px;
    }
    .modal.show {
      display: flex;
    }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      cursor: pointer;
      user-select: none;
      padding: 0 1rem;
    }
    .nav.left {
      left: 0;
    }
    .nav.right {
      right: 0;
    }
  </style>
</head>
<body>

<div id="modal" class="modal">
  <div class="nav left" id="prev">&larr;</div>
  <img id="modal-img" src="" alt="">
  <div class="nav right" id="next">&rarr;</div>
</div>

<script>
  const images = Array.from(document.querySelectorAll('.gallery img'));
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let currentIndex = -1;

  function showModal(index, updateHash = true) {
    if (index < 0 || index >= images.length) return;
    currentIndex = index;
    const img = images[currentIndex];
    modalImg.src = img.dataset.full;
    modal.classList.add('show');
    document.body.classList.add('no-scroll');

    if (updateHash) {
      console.log("Pushing state")
      history.pushState(null, '', `#!${encodeURIComponent(img.dataset.name)}`);
    }
  }

  function hideModal(updateHash = true) {
    modal.classList.remove('show');
    modalImg.src = '';
    document.body.classList.remove('no-scroll');
    currentIndex = -1;
    if (updateHash) {
      history.pushState(null, '', window.location.pathname);
    }
  }

  function navigate(offset) {
    const newIndex = (currentIndex + offset + images.length) % images.length;
    showModal(newIndex);
  }

  images.forEach((img, index) => {
    img.addEventListener('click', () => showModal(index));
  });

  prev.addEventListener('click', e => {
    e.stopPropagation();
    navigate(-1);
  });

  next.addEventListener('click', e => {
    e.stopPropagation();
    navigate(1);
  });

  modal.addEventListener('click', () => hideModal());

  // Touch swipe detection
  let touchStartX = 0;
  modal.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  });

  modal.addEventListener('touchend', e => {
    const deltaX = e.changedTouches[0].screenX - touchStartX;
    if (deltaX > 50) navigate(-1);
    else if (deltaX < -50) navigate(1);
  });

  // Open image from hashbang on load
  function openFromHash(hash, updateHash = false) {
    if (!hash.startsWith('#!')) {
      hideModal(false);
      return;
    }
    const targetName = decodeURIComponent(hash.slice(2));
    const index = images.findIndex(img => img.dataset.name === targetName);
    if (index !== -1) {
      showModal(index, updateHash);
    } else {
      hideModal(false);
    }
  }

  // Hash navigation support
  window.addEventListener('hashchange', () => {
    openFromHash(location.hash, false);
  });

  // Initial hash on page load
  window.addEventListener('load', () => {
    openFromHash(location.hash, false);
  });

  // Optional: close on ESC key
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('show')) {
      hideModal();
    }
  });
</script>
