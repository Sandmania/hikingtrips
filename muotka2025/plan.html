<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">

    <title>TrailTreader</title>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

    <link href="../assets/css/calendar.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="../assets/js/mmlLayers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>
    <script src="../assets/js/proj4-compressed.js"></script>
    <script src="../assets/js/proj4leaflet.js"></script>

    <style>
        html,
        body {
            margin: 0px;
            height: 100%;
        }

        body {
            display: flex;
            flex-flow: column wrap;
        }

        #content {
            flex: 1 1;
            order: 2;
            display: flex;
        }

        #map {
            flex: 1;
        }

        #right-content {
            display: none; /* Initially hidden */
            flex-direction: column;
            padding: 10px;
/*          With position absolute, could hover over the map
            position: absolute;
            top: 0;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            z-index: 1001;
            width: 300px;
            height: 100%;*/
        }

        /* Option 2: Wrap Under the Map */
        @media (max-width: 1000px) {
            #content {
                flex-direction: column;
            }

            #right-content {
                order: 2;
                width: 100%;
            }

            #map {
                order: 1;
                width: 100%;
            }
        }

        #close-button {
            align-self: flex-end;
            padding: 5px;
            background-color: white;
            border: 1px solid #ccc;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="content">
        <div id="map">
        </div>
        <div id="right-content">
            <button id="close-button">Close</button>
            <div id="info"></div>
            <div id="alternative-routes"></div>
        </div>
        <div id="calendar-container"></div>
    </div>
    <script type="module">
        import { loadYAMLConfig, initMap, updateMapWithAlternatives } from '../assets/js/map.js';
        import { renderTripCalendar } from '../assets/js/calendar.js';
        const configurationFileName = 'trip_config.yaml'
        loadYAMLConfig(configurationFileName).then((config) => {
            // Set the page title from the configuration
            document.title = config.heading;
            initMap(config);
            renderTripCalendar(config.travel_info);
        });

        document.getElementById('alternative-routes').addEventListener('change', (event) => {
            if (event.target.type === 'checkbox') {
                updateMapWithAlternatives();
            }
        });

        // Close button
        document.getElementById('close-button').addEventListener('click', () => {
            document.getElementById('right-content').style.display = 'none';
        });
    </script>
</body>

</html>
