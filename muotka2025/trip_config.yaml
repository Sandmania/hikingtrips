heading: Muotka 2025 - TrailTreader

defaults:
  walkingSpeed: 3
  numberOfZeroDays: 1
  tileLayer: "NLS Topographic map"
  availableTileLayers:
    - "Esri World Imagery"
    - "OpenTopoMap"
    - "OpenStreetMap"
    - "NLS Topographic map"
    #- "NLS Ortophoto"
  trip:
    color: 'black'
    opacity: 0.7
    weight: 7
    endIcon: ../assets/images/bonfire-outline.svg
    mealPlan:
      breakfast: true
      lunch: true
      dinner: true
      snacks: true
  alternatives:
    color: 'blue'
    opacity: 0.7
    weight: 5
    dashArray: '7, 7'
    endIcon: ../assets/images/bonfire-outline.svg
    mealPlan:
      breakfast: true
      lunch: true
      dinner: true
      snacks: true
  evacuation:
    color: 'red'
    opacity: 0.7
    weight: 5
    dashArray: '7, 7'
    startIcon: ../assets/images/medkit-outline.svg
    mealPlan:
      breakfast: false
      lunch: false
      dinner: false
      snacks: false
  zero:
    mealPlan:
      breakfast: true
      lunch: true
      dinner: true
      snacks: true

trip:
  - gpx: planned_route/Jeageloaivi_ele.gpx
    name: Day 1
    startIcon: ../assets/images/circle-play-regular.svg
    mealPlan:
      breakfast: false
      lunch: true
      dinner: true
      snacks: true
  - gpx: planned_route/Stuorravzi_ele.gpx
    name: Day 2
  - gpx: planned_route/Stuorraskaidi_ele.gpx
    name: Day 3
  - gpx: planned_route/Urroaivi_kuarvi_ele.gpx
    name: Day 4
    alternatives:
    - gpx: planned_route/Alt_ele.gpx
      name: Alt route for leg 4, skips leg 5 too
      skips: [5]
  - gpx: planned_route/Peltoj_rvi_ele.gpx
    name: Day 5
  - gpx: planned_route/Peltoaivi_ele.gpx
    name: Day 6
    endIcon: ../assets/images/flag-checkered-solid.svg
    mealPlan:
      breakfast: true
      lunch: true
      dinner: false
      snacks: true

evacuation:
  - gpx: planned_route/Evac_ele.gpx

