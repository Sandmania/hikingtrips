<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leaflet Layers Toggle on Click Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    #map {
      height: 100vh;
    }

    .leaflet-control-layers {
    pointer-events: auto;
}

.leaflet-control-layers:not(:active):hover {
    pointer-events: none;
}

.leaflet-control-layers.expanded {
    pointer-events: auto !important;
}

@media (hover: none) {
    .leaflet-control-layers {
        pointer-events: auto;
    }
}

  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Create the map
    const map = L.map('map').setView([51.505, -0.09], 13);

    // Tile layers
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenTopoMap contributors'
    });

    const baseMaps = {
      "OpenStreetMap": osm,
      "Topographic": topo
    };

    // Create layers control
    const layerControl = L.control.layers(baseMaps, null, { collapsed: true }).addTo(map);

    document.addEventListener('DOMContentLoaded', function() {
    const layersControl = document.querySelector('.leaflet-control-layers');
    
    // Show control on mousedown
    layersControl.addEventListener('mousedown', function() {
        this.classList.add('expanded');
    });
    
    // Hide control when mouse leaves while not active
    layersControl.addEventListener('mouseleave', function() {
        if (!this.matches(':active')) {
            this.classList.remove('expanded');
        }
    });
});
  </script>
</body>
</html>
