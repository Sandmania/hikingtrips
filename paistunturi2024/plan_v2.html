<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quick Start - Leaflet</title>


    <script src="https://unpkg.com/js-yaml/dist/js-yaml.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="assets/js/mmlLayers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="/assets/js/proj4-compressed.js"></script>
    <script src="/assets/js/proj4leaflet.js"></script>
    <!--<script src="/assets/js/map.js"></script> -->

    <style>
        html,
        body {
            margin: 0px;
            height: 100%;
        }

        body {
            display: flex;
            flex-flow: column wrap;
        }

        #content {
            flex: 1 1;
            order: 2;
            display: flex;
        }

        #map {
            flex: 1;
        }

        #info {
            padding: 10px;
        }
    </style>


</head>

<body>
    <div id="content">
        <div id="map"></div>
        <div>
            <div id="info"></div>
            <div id="alternative-routes"></div>
        </div>
    </div>
    <script type="module">
        import { loadYAMLConfig, initMap, updateMapWithAlternatives } from '../assets/js/map.js';
        const configurationFileName = 'trip_config.yaml'
        loadYAMLConfig(configurationFileName).then((config) => {
            initMap(config);
        });

        document.getElementById('alternative-routes').addEventListener('change', (event) => {
            if (event.target.type === 'checkbox') {
                updateMapWithAlternatives();
            }
        });
    </script>
</body>

</html>
