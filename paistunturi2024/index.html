<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">

    <title>TrailTreader</title>

    <link href="../assets/css/main.css" rel="stylesheet" />
    <link href="../assets/css/calendar.css" rel="stylesheet" />
    <link href="../assets/css/info.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

    <!-- Mapbox GL for vector tiles -->
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v1.5.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v1.5.0/mapbox-gl.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl-leaflet/0.0.16/leaflet-mapbox-gl.js"></script>

    <!-- leaflet-elevation -->
    <script src="https://cdn.jsdelivr.net/npm/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.js" integrity="sha256-Z/FTYiiAVwGeE4rl3LpmVN6p5KlulJ64thKUoneYMwk=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.css" integrity="sha256-Cw03qt3zMjRIGpKLc1iqjUVAvLauJYvyxTBTiISfCmQ=" crossorigin="anonymous">
    
    <script src="../assets/components/packDetails/PackDetails.js"></script>
</head>

<body>
    <div id="content">
        <div id="map">
        </div>
        <div id="elevation-div"></div>
        <div id="right-content">
            <div id="info"></div>
            <div id="alternative-routes"></div>
        </div>
        <div id="calendar-container"></div>
        <div id="event-tooltip" class="event-tooltip hidden"></div>
        <div id="pack-container"></div>

        <div id="errorToast" hidden>
            <span id="toastText"></span>
            <button id="dismissToast">✖</button>
        </div>
        
        <tt-pack-details csvUrl="Paistunturi_2024.csv"></tt-pack-details>
    </div>
    <script type="module">
        import { loadYAMLConfig, initMap, updateMapWithAlternatives } from '../assets/js/map.js';
        import { renderTripCalendar } from '../assets/js/calendar.js';
        const configurationFileName = 'trip_config.yaml'
        loadYAMLConfig(configurationFileName).then((config) => {
            // Set the page title from the configuration
            document.title = config.heading;
            initMap(config);
            renderTripCalendar(config.travel_info);
        });

        document.getElementById('alternative-routes').addEventListener('change', (event) => {
            if (event.target.type === 'checkbox') {
                updateMapWithAlternatives();
            }
        });
    </script>
</body>

</html>
