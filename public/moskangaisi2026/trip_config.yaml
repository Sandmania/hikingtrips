heading: Moskángáisi 2026 - TrailTreader

defaults:
  numberOfZeroDays: 2
  tileLayer: FiSeNo Composite
  availableTileLayers:
    - "Esri World Imagery"
    - "OpenTopoMap"
    - "OpenStreetMap"
    - "FiSeNo Composite"
    - "Lantmäteriet"
    - "Kartverket"
    - "NLS Topographic map"
    - "NLS Vector tiles"
  walkingSpeed: 3
  trip:
    color: 'black'
    opacity: 0.7
    weight: 7
    endIcon: ../assets/images/bonfire-outline.svg
    mealPlan:
      breakfast: true
      lunch: true
      dinner: true
      snacks: true
  alternatives:
    color: 'blue'
    opacity: 0.7
    weight: 5
    dashArray: '7, 7'
    endIcon: ../assets/images/bonfire-outline.svg
    mealPlan:
      breakfast: true
      lunch: true
      dinner: true
      snacks: true
  evacuation:
    color: 'red'
    opacity: 0.7
    weight: 5
    dashArray: '7, 7'
    startIcon: ../assets/images/medkit-outline.svg
    mealPlan:
      breakfast: false
      lunch: false
      dinner: false
      snacks: false
  zero:
    mealPlan:
      breakfast: true
      lunch: true
      dinner: true
      snacks: true      

trip:
  - gpx: planned_route/Kuohkimajarvi_ele.gpx
    startIcon: ../assets/images/circle-play-regular.svg
    mealPlan:
      breakfast: false
      lunch: true # Lunch on the road or at Ritsem?
      dinner: true
      snacks: true
    description: >
      
  - gpx: planned_route/Kuohkimajarvi_Gappohytta_ele.gpx
    description: >
    alternatives:
    - gpx: planned_route/Gappohytta_alt_ele.gpx

  - gpx: planned_route/Iselva_ele.gpx
    description: Bridge over Iselva is broken, so no point of going to Rostahytta

  - gpx: planned_route/Iselva_M_skohytta_P_ltsastugan_ele.gpx
    description: >
    alternatives:
    - gpx: planned_route/Iselva_Paltsastugan_ele.gpx

  - gpx: planned_route/Golddaluokta.gpx
    endIcon: ../assets/images/flag-checkered-solid.svg
    mealPlan:
      breakfast: true
      lunch: true
      dinner: false
      snacks: true
    description: >

evacuation:
  - gpx: planned_route/evac1_ele.gpx
  - gpx: planned_route/evac2.gpx
    startIcon:
    endIcon: ../assets/images/medkit-outline.svg

