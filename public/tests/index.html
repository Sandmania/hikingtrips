<!doctype html>
<html lang="en">
<head>
    <title>Hiking Trips - Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <!-- https://unpkg.com/mocha@9.2.2/mocha.css -->
    <link rel="stylesheet" href="https://unpkg.com/mocha@9.2.2/mocha.css" />
    <!-- https://unpkg.com/chai@4.3.6/chai.js -->
    <script src="https://unpkg.com/chai@4.3.6/chai.js" defer></script>
    <!-- https://unpkg.com/mocha@9.2.2/mocha.js -->
    <script src="https://unpkg.com/mocha@9.2.2/mocha.js" defer></script>
    <!-- https://unpkg.com/@testing-library/dom@8.17.1/dist/@testing-library/dom.umd.js -->
    <script src="https://unpkg.com/@testing-library/dom@8.17.1/dist/@testing-library/dom.umd.js" defer></script>

    <!-- The same Leaflet the trip view loads, so the map's own modules — the
         hover marker — can be tested against a real map rather than a stand-in. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js" defer></script>

    <script src="../assets/js/loadAssets.js" defer></script>

    <script type="module" defer>
        mocha.setup('bdd');
        mocha.checkLeaks();
        // The weather timeline shares leaflet-elevation's d3 global (ADR-0001),
        // so d3 appearing on window is the design, not a leak. Leaflet keeps its
        // own window listeners under _leaflet_events once a map exists.
        mocha.globals(['d3', '_leaflet_events']);
    </script>

    <script type="module" src="./packDetails.test.js" defer></script>
    <script type="module" src="./calendar.test.js" defer></script>
    <script type="module" src="./tripCard.test.js" defer></script>
    <script type="module" src="./tripGrid.test.js" defer></script>
    <script type="module" src="./mealPlan.test.js" defer></script>
    <script type="module" src="./actualRoute.test.js" defer></script>
    <script type="module" src="./exposureRecord.test.js" defer></script>
    <script type="module" src="./extremes.test.js" defer></script>
    <script type="module" src="./nearestSample.test.js" defer></script>
    <script type="module" src="./positionAt.test.js" defer></script>
    <script type="module" src="./hoverMarker.test.js" defer></script>
    <script type="module" src="./waypointGroups.test.js" defer></script>
    <script type="module" src="./waypointLayer.test.js" defer></script>
    <script type="module" src="./weatherTimeline.test.js" defer></script>
    <script type="module" src="./muotka2025Golden.test.js" defer></script>

    <!-- include more tests here -->

    <script type="module" src="./index.js" defer></script>
</head>
<body>
    <div id="mocha"></div>
</body>
</html>
